<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nfa-title nfa-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="nfa-title">Notational friction audit</title>
  <desc id="nfa-desc">A cream title card showing the two things a notation audit looks for: on the left, the symbols k and beta converging on one label, wavevector; on the right, the single symbol lambda diverging to two labels of opposite dimension, wavelength and one over length.</desc>
  <rect width="960" height="540" fill="#f4efe2"/>

  <text x="128" y="72" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" letter-spacing="3.2" fill="#6a6555">INVENTORY &#183; CROSS-REFERENCE &#183; SCORE</text>

  <text x="128" y="152" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.8" fill="#1c1a12">Auditing the notation,</text>
  <text x="128" y="204" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.8" fill="#1c1a12">not the chemistry</text>

  <!-- left: one quantity, two symbols (F1) -->
  <rect x="128" y="300" width="64" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="160" y="339" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#1c1a12" text-anchor="middle">k</text>
  <rect x="128" y="380" width="64" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="160" y="419" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#1c1a12" text-anchor="middle">&#946;</text>

  <g fill="none" stroke="#b9b3a1" stroke-width="2">
    <path d="M 192 328 H 240 V 368 H 296"/>
    <path d="M 192 408 H 240 V 368 H 296"/>
  </g>
  <path d="M 284 360 L 298 368 L 284 376" fill="none" stroke="#b9b3a1" stroke-width="2"/>

  <rect x="308" y="340" width="196" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="326" y="374" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#1c1a12">WAVEVECTOR</text>

  <text x="128" y="478" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#6a6555">one quantity, two symbols</text>

  <line x1="528" y1="288" x2="528" y2="448" stroke="#b9b3a1" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- right: one symbol, two quantities of opposite dimension (F2 + F9) -->
  <rect x="564" y="340" width="64" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="596" y="379" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#1c1a12" text-anchor="middle">&#955;</text>

  <g fill="none" stroke="#c0442b" stroke-width="2">
    <path d="M 628 368 H 664 V 318 H 688"/>
    <path d="M 628 368 H 664 V 418 H 688"/>
    <path d="M 676 310 L 690 318 L 676 326"/>
    <path d="M 676 410 L 690 418 L 676 426"/>
  </g>

  <rect x="700" y="290" width="132" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="716" y="324" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#1c1a12">LENGTH</text>
  <rect x="700" y="390" width="132" height="56" fill="#f4efe2" stroke="#1c1a12" stroke-width="2"/>
  <text x="716" y="424" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#1c1a12">1 / LENGTH</text>

  <text x="564" y="478" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#6a6555">one symbol, two dimensions</text>
</svg>
