name: PR page screenshots

# On every pull request, build the site and screenshot the pages the PR adds
# or changes, then upload the images as a workflow artifact.
#
# This workflow runs with the PR's own (possibly fork-contributed) code and a
# read-only token, so it never writes to the repository or the PR. The
# companion "PR page screenshots (comment)" workflow runs afterwards in the
# base repository via `workflow_run`, downloads the artifact, commits the
# images to the dedicated `pr-screenshots` branch, and posts them in a single
# auto-updating PR comment. Splitting the two is what lets fork PRs get the
# preview comment without handing a write token to untrusted code.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate homepage tallies
        run: ruby scripts/generate_tallies.rb

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Determine changed pages
        id: pages
        run: |
          mkdir -p pr-shots
          bash scripts/pr_changed_pages.sh "origin/${{ github.base_ref }}" | head -12 > pr-shots/changed_pages.txt
          echo "count=$(wc -l < pr-shots/changed_pages.txt)" >> "$GITHUB_OUTPUT"
          echo "Pages to screenshot:"
          cat pr-shots/changed_pages.txt

      - name: Take screenshots
        if: steps.pages.outputs.count != '0'
        run: |
          python3 -m http.server 8080 --directory _site &
          npx -y playwright@1.55.0 install --with-deps chromium
          while IFS=$'\t' read -r status url slug; do
            echo "Screenshotting /$url -> $slug.png"
            npx -y playwright@1.55.0 screenshot \
              --browser=chromium \
              --full-page \
              --viewport-size=1280,900 \
              --wait-for-timeout=3000 \
              "http://127.0.0.1:8080/$url" "pr-shots/$slug.png"
          done < pr-shots/changed_pages.txt

      # The artifact carries the PNGs plus changed_pages.txt (the page list the
      # comment is built from). The comment workflow treats both as untrusted.
      - name: Upload screenshots as workflow artifact
        if: steps.pages.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pr-page-screenshots
          path: pr-shots/
          retention-days: 7
