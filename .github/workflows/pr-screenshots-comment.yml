name: PR page screenshots (comment)

# Second half of the PR screenshot pipeline. "PR page screenshots" runs on
# `pull_request` with a read-only token (so it is safe for fork PRs) and only
# uploads the images as an artifact. This workflow fires when that run
# completes, runs in the base repository with a write token, downloads the
# artifact, commits the images to the dedicated `pr-screenshots` branch (never
# merged anywhere) so they can be embedded inline, and posts or updates a
# single preview comment on the PR.
#
# Everything inside the artifact was produced by the PR's code and is treated
# as untrusted: the PR is resolved from the triggering run's head repo/branch/
# sha (not from anything in the artifact), and the page list is validated
# before it is used to build the comment.
#
# Note: `workflow_run` workflows only trigger from the version on the default
# branch, so changes here take effect once merged to main.

on:
  workflow_run:
    workflows: ["PR page screenshots"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-screenshots-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Locate the pull request and screenshot artifact
        id: locate
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // run.pull_requests is empty for fork PRs, so look the PR up by
            // head repo owner + branch and require the head sha to match.
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 20,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR at ${run.head_sha} for ${run.head_repository.full_name}:${run.head_branch}; nothing to do.`);
              return;
            }
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: run.id,
            });
            const artifact = artifacts.find(a => a.name === 'pr-page-screenshots' && !a.expired);
            if (!artifact) {
              core.info('Run produced no screenshots (no page changes); nothing to do.');
              return;
            }
            core.info(`PR #${pr.number}, artifact ${artifact.id}`);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('artifact_id', String(artifact.id));

      - name: Download screenshots artifact
        if: steps.locate.outputs.artifact_id
        uses: actions/download-artifact@v4
        with:
          name: pr-page-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Validate artifact contents
        id: validate
        if: steps.locate.outputs.artifact_id
        run: |
          set -euo pipefail
          # A single artifact is extracted directly into `path`; tolerate the
          # nested layout too in case the action's default changes.
          src=artifact
          [[ -d artifact/pr-page-screenshots ]] && src=artifact/pr-page-screenshots
          mkdir -p shots
          : > changed_pages.txt
          # Keep only well-formed lines whose slug has a real PNG behind it.
          while IFS=$'\t' read -r status url slug; do
            [[ "$status" =~ ^[A-Z]$ ]] || continue
            [[ "$url" =~ ^[A-Za-z0-9._/-]*$ ]] || continue
            [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || continue
            png="$src/$slug.png"
            [[ -f "$png" ]] || continue
            [[ "$(head -c 8 "$png" | od -An -tx1 | tr -d ' \n')" == "89504e470d0a1a0a" ]] || continue
            cp "$png" "shots/$slug.png"
            printf '%s\t%s\t%s\n' "$status" "$url" "$slug" >> changed_pages.txt
          done < <(head -12 "$src/changed_pages.txt" 2>/dev/null || true)
          echo "count=$(wc -l < changed_pages.txt)" >> "$GITHUB_OUTPUT"
          echo "Validated pages:"
          cat changed_pages.txt

      - name: Publish screenshots to pr-screenshots branch
        id: publish
        if: steps.validate.outputs.count != '' && steps.validate.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.locate.outputs.pr_number }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          git -C "$workdir" init -q -b pr-screenshots
          git -C "$workdir" config user.name "github-actions[bot]"
          git -C "$workdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$workdir" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$workdir" fetch -q --depth=1 origin pr-screenshots; then
            git -C "$workdir" checkout -q -B pr-screenshots FETCH_HEAD
          fi
          rm -rf "$workdir/pr-$PR_NUMBER"
          mkdir -p "$workdir/pr-$PR_NUMBER"
          cp shots/*.png "$workdir/pr-$PR_NUMBER/"
          git -C "$workdir" add -A
          git -C "$workdir" commit -q -m "Screenshots for PR #$PR_NUMBER (run $GITHUB_RUN_ID)"
          for attempt in 1 2 3; do
            if git -C "$workdir" push -q origin pr-screenshots; then
              break
            fi
            git -C "$workdir" pull -q --rebase origin pr-screenshots || true
            sleep 2
          done
          echo "sha=$(git -C "$workdir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.publish.outputs.sha
        uses: actions/github-script@v7
        env:
          SCREENSHOTS_SHA: ${{ steps.publish.outputs.sha }}
          PR_NUMBER: ${{ steps.locate.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.SCREENSHOTS_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const marker = '<!-- pr-page-screenshots -->';
            const lines = fs.readFileSync('changed_pages.txt', 'utf8').trim().split('\n');

            let body = `${marker}\n## 📸 Page previews\n\n` +
              `Screenshots of the pages this PR adds or changes, ` +
              `built from ${headSha.slice(0, 7)}:\n\n`;
            for (const line of lines) {
              const [status, url, slug] = line.split('\t');
              const label = url === '' ? 'Home page' : `/${url}`;
              const badge = status === 'A' ? ' 🆕 new page' : '';
              const img = `https://raw.githubusercontent.com/${context.repo.owner}/` +
                `${context.repo.repo}/${sha}/pr-${prNumber}/${slug}.png`;
              body += `<details open><summary><b>${label}</b>${badge}</summary>\n\n` +
                `![${label}](${img})\n\n</details>\n\n`;
            }
            body += '_This comment updates automatically on every push._\n';

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body,
              });
            }
