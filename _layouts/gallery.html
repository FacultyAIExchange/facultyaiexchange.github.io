---
layout: default
---

<main class="page gallery-page">
  <header class="page-header">
    <p class="eyebrow">Faculty using AI</p>
    {{ content }}
  </header>

  <section class="resource-list" aria-labelledby="gallery-heading">
    <div class="section-heading heading-row">
      <h2 id="gallery-heading">Examples</h2>
      <span class="heading-rule" aria-hidden="true"></span>
    </div>
    <div class="card-grid">
      {% assign examples = site.examples | sort: "title" %}
      {% for example in examples %}
        {% include example-card.html example=example %}
      {% endfor %}
    </div>
  </section>
</main>
